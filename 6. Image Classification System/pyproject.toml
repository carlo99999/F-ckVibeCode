[project]
name = "6-image-classification-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carlo Piccinin", email = "c.piccinin@teamsystem.com" }
]
requires-python = ">=3.14"
dependencies = [
    "kagglehub>=1.0.1",
    "marimo>=0.23.6",
    "pillow>=12.2.0",
    "pyrefly>=1.0.0",
    "ruff>=0.15.13",
    "timm>=1.0.27",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[project.scripts]
6-image-classification-system = "6_image_classification_system:main"

[tool.uv.sources]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv_build]
module-root = "src"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
packageIndexDefaults = []
extraPaths = ["src"]
