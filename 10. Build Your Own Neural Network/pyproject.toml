[project]
name = "build-your-own-neural-network"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carlo Piccinin", email = "c.piccinin@teamsystem.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.6",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.14"
